version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pg-azyk
    environment:
      POSTGRES_USER: azyk
      POSTGRES_PASSWORD: azyk
      POSTGRES_DB: azyk
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data: